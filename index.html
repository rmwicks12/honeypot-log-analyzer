<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honeypot Threat Heatmap</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        body {
            background-color: #0d1117; /* Dark GitHub-style background */
            color: #c9d1d9;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #ff4444; }
        
        /* The Map Container */
        #map {
            height: 600px;
            width: 80%;
            margin: 0 auto;
            border: 2px solid #30363d;
            border-radius: 8px;
            box-shadow: 0px 0px 15px rgba(255, 68, 68, 0.2);
        }
    </style>
</head>
<body>

    <h1>⚠️ Live Threat Heatmap ⚠️</h1>
    <p>Monitoring unauthorized access attempts across global regions.</p>
    
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // 1. Initialize the map and set the starting view to a global perspective
        var map = L.map('map').setView([20.0, 0.0], 2);

        // 2. Load the dark-themed map tiles (CartoDB Dark Matter)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // 3. Define a custom red icon for the attackers
        var threatIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // =========================================================
        // DEMO DATA: These are the exact coordinates your Python
        // script logged earlier (Russia and China).
        // =========================================================
        // 3. Define a custom red icon for the attackers
        var threatIcon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
            shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
            iconSize: [25, 41],
            iconAnchor: [12, 41],
            popupAnchor: [1, -34],
            shadowSize: [41, 41]
        });

        // 4. Fetch LIVE data from the Python Flask API
        let trackedIPs = new Set(); 

async function loadLiveThreats() {
    console.log("Checking for new threats..."); // This helps you see it working in the Console
    try {
        const response = await fetch('http://localhost:5000/api/threats');
        const attacks = await response.json();

        attacks.forEach(function(attack) {
            // Only add if it's a brand new IP
            if (!trackedIPs.has(attack.ip_address)) {
                
                let marker = L.marker([attack.latitude, attack.longitude], {icon: threatIcon})
                    .addTo(map)
                    .bindPopup(`<b>LIVE ATTACK</b><br>City: ${attack.location_city}<br>IP: ${attack.ip_address}`);
                
                // Optional: Auto-open the popup for the very latest attack
                marker.openPopup();

                trackedIPs.add(attack.ip_address);
            }
        });
    } catch (error) {
        console.log("Connection to Flask failed. Is app.py running?");
    }
}

// 2. THIS IS THE KEY: Run the function immediately, then every 2 seconds
loadLiveThreats(); 
setInterval(loadLiveThreats, 2000);
    </script>

</body>
</html>
